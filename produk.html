// Admin: Apply product overrides (from cache or Firestore)
function _patchProds(items){
  try{
    items.forEach(function(o){
      if(!PRODUCTS[o.id])return;
      if(o.name)PRODUCTS[o.id].name=o.name;
      if(o.price&&o.price>0)PRODUCTS[o.id].price=o.price;
      if(o.rating&&o.rating>0)PRODUCTS[o.id].rating=parseFloat(o.rating);
      if(o.sales!=null)PRODUCTS[o.id].sales=Number(o.sales);
      if(o.imgData)PRODUCTS[o.id].img=o.imgData;
      else if(o.img)PRODUCTS[o.id].img=o.img;
    });
  }catch(_){}
}
// Apply cache immediately
(function(){
  try{var ap=JSON.parse(localStorage.getItem('ipi_admin_products'));if(ap&&ap.length)_patchProds(ap);}catch(_){}
})();

    }).catch(function(){});
  }catch(_){}
})();
</script>
