    <div class="pd-sec">
      <div class="pd-sec-ttl">${lang==='en' ? 'About the Product' : 'Tentang Produk'}</div>
      <div class="pd-about">${loc.about.map ? loc.about.map(t=>`<p style="margin-bottom:6px">${esc(t)}</p>`).join('') : loc.about}</div>
    </div>

    <div class="pd-sec">
      <div class="pd-sec-ttl">${lang==='en' ? 'What You Get' : 'Yang Kamu Dapatkan'}</div>
      <ul class="pd-feat">
        ${loc.features.map(f=>`<li><div class="pd-feat-check">✓</div><span>${f}</span></li>`).join('')}
      </ul>
    </div>

    <div class="pd-sec">
      <div class="pd-sec-ttl">${lang==='en' ? 'What is Included' : 'Termasuk dalam Paket'}</div>
      <div class="pd-includes">
        ${loc.includes.map(i=>`<div class="pd-inc"><span class="pd-inc-icon">📦</span><span>${i}</span></div>`).join('')}
      </div>
    </div>

    ${caraOrderHtml(lang)}

    <div class="pd-note"><span>💡</span><span>${loc.note}</span></div>
  `;
  document.getElementById('ctaPrice').textContent = fmtP(priceNow);

  if (promoTimer) { clearInterval(promoTimer); promoTimer = null; }
  if (promoActive) {
    const tickPromo = () => {
      const el = document.getElementById('pdPromoCountdown');
      if (!el) { clearInterval(promoTimer); promoTimer = null; return; }
      el.textContent = promoRemainingText(promoCycleRemainingMs());
    };
    tickPromo();
    promoTimer = setInterval(tickPromo, 1000);
  }

  const ctaBtn = document.getElementById('ctaBtn');
  ctaBtn.href = `bayar.html?id=${id}`;
  if (p.soldOut) {
    const ctaLbl = document.getElementById('ctaLbl');
    ctaLbl.textContent = priceLbl;
    ctaLbl.removeAttribute('data-i18n');
    ctaBtn.textContent = 'SOLD OUT';
    ctaBtn.removeAttribute('data-i18n');
  }
}

const TG_CONTACT = 'https://t.me/iipistore';

function renderComingSoon(lang, loc){
  const en = lang==='en';
  const soonLbl = en ? 'Coming Soon' : 'Segera Hadir';
  const statusLbl = en ? 'Status' : 'Status';
  const waitlistLbl = en ? 'Join Waitlist →' : 'Daftar Tunggu →';

  document.title = loc.short + ' — IPI Digital';
  document.getElementById('pdContent').innerHTML = `
    <div class="pd-hero">
      <div class="pd-icon"><img src="${esc(p.img)}" alt="${esc(loc.short)}" style="width:100%;height:100%;object-fit:cover;display:block;"></div>
      <div class="pd-hero-body">
        <span class="product-badge badge-gold" style="position:static;font-size:11px;margin-bottom:10px;display:inline-block">${soonLbl}</span><br>
        <div class="pd-name">${esc(loc.name)}</div>
        <div class="pd-tagline">${loc.tagline}</div>
        <div class="pd-price-pill">
          <div>
            <div class="pd-price-lbl">${statusLbl}</div>
            <div class="pd-price-val" style="color:#f59e0b">${soonLbl}</div>
          </div>
        </div>
      </div>
    </div>

    <div class="pd-warn-box">
      <div class="pd-warn-ttl"><span>⚠️</span><span>${esc(loc.warnTitle.replace(/^⚠️\s*/,''))}</span></div>
      <ul class="pd-warn-list">
        ${loc.warnProvide.map(t=>`<li class="ok"><span>✅</span><span>${esc(t)}</span></li>`).join('')}
        ${loc.warnNotProvide.map(t=>`<li class="no"><span>❌</span><span>${esc(t)}</span></li>`).join('')}
      </ul>
      ${loc.warnBody.map(t=>`<p>${esc(t)}</p>`).join('')}
    </div>

    <div class="pd-sec">
      <div class="pd-sec-ttl">${esc(loc.aboutTtl)}</div>
      <div class="pd-about">${loc.about.map(t=>`<p style="margin-bottom:6px">${esc(t)}</p>`).join('')}</div>
    </div>

    <div class="pd-sec">
      <div class="pd-sec-ttl">${esc(loc.getTtl)}</div>
      <div class="pd-get-list">
        ${loc.getCards.map((c,i)=>`<div class="pd-get-card"><div class="pd-get-num">${i+1}</div><div><h4>${esc(c.t)}</h4><p>${esc(c.d)}</p></div></div>`).join('')}
      </div>
    </div>

    <div class="pd-sec">
      <div class="pd-sec-ttl">${esc(loc.knowTtl)}</div>
      <ul class="pd-know-list">
        ${loc.knowPoints.map(k=>`<li><span class="pd-know-icon">●</span><span>${esc(k)}</span></li>`).join('')}
      </ul>
    </div>

    <div class="pd-sec">
      <div class="pd-sec-ttl">${esc(loc.forTtl)}</div>
      <div class="pd-about">${loc.forWhom.map(t=>`<p style="margin-bottom:6px">${esc(t)}</p>`).join('')}</div>
    </div>

    <div class="pd-soon-cta">
      <a href="${TG_CONTACT}" target="_blank" class="btn btn-gold btn-lg">${waitlistLbl}</a>
      <p>${en?'Have questions? Contact us on ':'Ada pertanyaan? Hubungi kami di '}<a href="${TG_CONTACT}" target="_blank" class="pd-contact-link">Telegram</a>.</p>
    </div>
  `;

  const ctaLbl = document.getElementById('ctaLbl');
  ctaLbl.textContent = statusLbl;
  ctaLbl.removeAttribute('data-i18n');

  const ctaPrice = document.getElementById('ctaPrice');
  ctaPrice.textContent = soonLbl;
  ctaPrice.style.color = '#f59e0b';

  const ctaBtn = document.getElementById('ctaBtn');
  ctaBtn.textContent = waitlistLbl;
  ctaBtn.href = TG_CONTACT;
  ctaBtn.target = '_blank';
  ctaBtn.removeAttribute('data-i18n');
  ctaBtn.classList.remove('btn-primary');
  ctaBtn.classList.add('btn-gold');
}

function renderVariants(lang, loc){
  document.title = loc.short + ' — IPI Digital';
  const startLbl = lang==='en' ? 'Starting From' : 'Mulai Dari';
  const chooseTtl = lang==='en' ? 'Choose Your Option' : 'Pilih Opsi Anda';
  const seeOptionsLbl = lang==='en' ? 'See Options ↓' : 'Lihat Pilihan ↓';
  const variants = loc.variants;
  const lowestPrice = Math.min.apply(null, variants.map(function(v){ return v.price; }));
  const fmt = function(n){ return window.ipiFmtMoney ? window.ipiFmtMoney(n) : ('Rp '+n.toLocaleString('id-ID')); };
  const badge = p.badge ? `<span class="product-badge ${p.badgeClass||''}" style="position:static;font-size:11px;margin-bottom:10px;display:inline-block">${esc(p.badge)}</span><br>` : '';
  const soldWord = lang==='en' ? ' total sold' : ' total terjual';
  const ratingRow = p.rating!=null ? `
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:12px">
          <span style="color:#f59e0b;font-size:13px;letter-spacing:.5px">★★★★★</span>
          <span style="color:#ffffff;font-weight:700">${p.rating.toFixed(1)}</span>
          <span style="color:#96a6bd">·</span>
          <span style="color:#ffffff">${p.sales}${soldWord}</span>
        </div>` : '';

  const variantCards = variants.map(function(v){
    const bonusRibbon = v.promoBonus ? `
      <div class="pd-variant-bonus">${esc(v.promoBonus)} <span class="pd-variant-bonus-sep">·</span> ${lang==='en'?'resets in':'reset dalam'} <span id="pdPromoCountdown">--:--:--</span></div>` : '';
    return `
    <div class="pd-variant-card">
      <div class="pd-variant-top">
        <div>
          <div style="font-size:16px;font-weight:800;color:#ffffff">${esc(v.title)}</div>
          ${v.tag ? `<span class="pd-variant-tag">${esc(v.tag)}</span>` : ''}
        </div>
        <div class="pd-variant-price">${fmt(v.price)}</div>
      </div>
      <ul class="pd-feat" style="margin-top:14px">
        ${v.bullets.map(function(b){ return `<li><div class="pd-feat-check">✓</div><span>${esc(b)}</span></li>`; }).join('')}
      </ul>
      ${bonusRibbon}
      <a href="bayar.html?id=${esc(v.id)}" class="btn btn-primary btn-lg" style="width:100%;text-align:center;margin-top:16px;display:block">${esc(v.btnLabel)}</a>
    </div>`;
  }).join('');

  document.getElementById('pdContent').innerHTML = `
    <div class="pd-hero">
      <div class="pd-icon"><img src="${esc(p.img)}" alt="${esc(loc.short)}" style="width:100%;height:100%;object-fit:cover;display:block;"></div>
      <div class="pd-hero-body">
        ${badge}
        <div class="pd-name">${esc(loc.name)}</div>
        <div class="pd-tagline">${loc.tagline}</div>
        ${ratingRow}
        <div class="pd-price-pill">
          <div>
            <div class="pd-price-lbl">${startLbl}</div>
            <div class="pd-price-val">${fmt(lowestPrice)}</div>
          </div>
        </div>
      </div>
    </div>

    <div class="pd-sec">
      <div class="pd-sec-ttl">${lang==='en' ? 'About the Product' : 'Tentang Produk'}</div>
      <div class="pd-about">${loc.about.map(function(t){ return `<p style="margin-bottom:6px">${esc(t)}</p>`; }).join('')}</div>
    </div>

    <div class="pd-sec" id="pdVariants">
      <div class="pd-sec-ttl">${esc(chooseTtl)}</div>
      <div class="pd-variant-list">
        ${variantCards}
      </div>
    </div>

    ${caraOrderHtml(lang)}

    <div class="pd-note"><span>💡</span><span>${loc.note}</span></div>
  `;

  const ctaLbl = document.getElementById('ctaLbl');
  ctaLbl.textContent = startLbl;
  ctaLbl.removeAttribute('data-i18n');

  document.getElementById('ctaPrice').textContent = fmt(lowestPrice);

  const ctaBtn = document.getElementById('ctaBtn');
  ctaBtn.textContent = seeOptionsLbl;
  ctaBtn.removeAttribute('data-i18n');
  ctaBtn.href = '#pdVariants';
  ctaBtn.removeAttribute('target');
  ctaBtn.classList.remove('btn-gold');
  ctaBtn.classList.add('btn-primary');

  if (promoTimer) { clearInterval(promoTimer); promoTimer = null; }
  if (variants.some(function(v){ return v.promoBonus; })) {
    const tickPromo = () => {
      const el = document.getElementById('pdPromoCountdown');
      if (!el) { clearInterval(promoTimer); promoTimer = null; return; }
      el.textContent = promoRemainingText(promoCycleRemainingMs());
    };
    tickPromo();
    promoTimer = setInterval(tickPromo, 1000);
  }
}

render();
document.addEventListener('ipi-lang-change', render);
</script>
</body>
</html>
