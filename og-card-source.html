<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width:1200px; height:630px; overflow:hidden;
    background:#06020f;
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display:flex; align-items:center; justify-content:center;
    position:relative;
  }
  /* purple/pink glow blooms, same palette as the site */
  .glow-a { position:absolute; top:-160px; left:-140px; width:680px; height:680px;
    background:radial-gradient(circle, rgba(147,51,234,.28) 0%, transparent 65%); }
  .glow-b { position:absolute; bottom:-200px; right:-120px; width:620px; height:620px;
    background:radial-gradient(circle, rgba(236,72,153,.22) 0%, transparent 65%); }
  /* faint grid + stars, echoing the live site background */
  .grid { position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(147,51,234,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(147,51,234,.05) 1px, transparent 1px);
    background-size:60px 60px; }
  .stars { position:absolute; inset:0;
    background-image:
      radial-gradient(2px 2px at 12% 18%, rgba(255,255,255,.9), transparent),
      radial-gradient(1.6px 1.6px at 28% 72%, rgba(255,255,255,.65), transparent),
      radial-gradient(2.2px 2.2px at 47% 26%, rgba(255,255,255,.8), transparent),
      radial-gradient(1.6px 1.6px at 68% 66%, rgba(255,255,255,.6), transparent),
      radial-gradient(2px 2px at 84% 22%, rgba(255,255,255,.85), transparent),
      radial-gradient(1.6px 1.6px at 92% 78%, rgba(255,255,255,.55), transparent),
      radial-gradient(1.6px 1.6px at 58% 88%, rgba(255,255,255,.6), transparent); }

  .inner { display:flex; align-items:center; gap:56px; position:relative; z-index:2; padding:0 80px; }

  .logo-ring { position:relative; padding:5px; border-radius:36px; flex-shrink:0;
    background:conic-gradient(from 0deg, #7c3aed, #a855f7, #ec4899, #06b6d4, #7c3aed);
    box-shadow:0 0 60px rgba(147,51,234,.45); }
  .logo-ring img { width:240px; height:240px; border-radius:31px; display:block; object-fit:cover; }

  .copy { flex:1; }
  .eyebrow { display:inline-block; font-size:19px; font-weight:700; letter-spacing:.16em;
    text-transform:uppercase; color:#c084fc;
    background:rgba(168,85,247,.12); border:1px solid rgba(168,85,247,.3);
    border-radius:99px; padding:9px 22px; margin-bottom:26px; }
  .brand { font-size:78px; font-weight:900; letter-spacing:.01em; line-height:1; margin-bottom:20px;
    background:linear-gradient(100deg, #ffffff 0%, #d8b4fe 45%, #f9a8d4 100%);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
  .tagline { font-size:31px; font-weight:600; color:#ffffff; line-height:1.35; margin-bottom:30px; }
  .tagline span { color:#c084fc; }
  .pills { display:flex; gap:12px; flex-wrap:wrap; }
  .pill { font-size:19px; font-weight:600; color:#e9d5ff;
    background:rgba(147,51,234,.14); border:1px solid rgba(168,85,247,.28);
    border-radius:10px; padding:10px 18px; }
  .domain { position:absolute; bottom:38px; right:80px; z-index:3;
    font-size:22px; font-weight:700; color:#a855f7; letter-spacing:.04em; }
</style>
</head>
<body>
  <div class="glow-a"></div>
  <div class="glow-b"></div>
  <div class="grid"></div>
  <div class="stars"></div>

  <div class="inner">
    <div class="logo-ring"><img src="logo.webp" alt=""></div>
    <div class="copy">
      <span class="eyebrow">AI Trading · Automasi · Tools</span>
      <div class="brand">IPI DIGITAL</div>
      <div class="tagline">Produk Digital untuk <span>AI Trading</span><br>dan Automasi Trading</div>
      <div class="pills">
        <span class="pill">EA MT5</span>
        <span class="pill">Indikator TradingView</span>
        <span class="pill">Prompt &amp; Data AI</span>
      </div>
    </div>
  </div>
  <div class="domain">ipi-digital.com</div>
</body>
</html>
