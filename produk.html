// Shared recurring 48h promo cycle — powers the 3 flash-sale slides on the homepage
// (EA Breakout VPS bonus, Doktrin -10%, Sniper -10%) plus the discount shown here.
// Keep PROMO_EPOCH/PROMO_CYCLE_MS in sync with index.html & bayar.html.
const PROMO_EPOCH = new Date('2026-07-16T00:00:00+07:00').getTime();
const PROMO_CYCLE_MS = 48*3600*1000;
function promoCycleRemainingMs(){
  const elapsed = (Date.now() - PROMO_EPOCH) % PROMO_CYCLE_MS;
  return PROMO_CYCLE_MS - elapsed;
}
let promoTimer = null;
function pad2(n){ return String(n).padStart(2,'0'); }
function promoRemainingText(ms){
  if (ms <= 0) return '00:00:00';
  const totalSec = Math.floor(ms/1000);
  const h = Math.floor(totalSec/3600), m = Math.floor((totalSec%3600)/60), s = totalSec%60;
  return pad2(h)+':'+pad2(m)+':'+pad2(s);
}

  const chooseTtl = lang==='en' ? 'Choose Your Option' : 'Pilih Opsi Anda';
  const seeOptionsLbl = lang==='en' ? 'See Options ↓' : 'Lihat Pilihan ↓';
  const variants = loc.variants;
  const lowestPrice = Math.min.apply(null, variants.map(function(v){ return v.price; }));
  const fmt = function(n){ return window.ipiFmtMoney ? window.ipiFmtMoney(n) : ('Rp '+n.toLocaleString('id-ID')); };
  const badge = p.badge ? `<span class="product-badge ${p.badgeClass||''}" style="position:static;font-size:11px;margin-bottom:10px;display:inline-block">${esc(p.badge)}</span><br>` : '';
  const soldWord = lang==='en' ? ' total sold' : ' total terjual';
  const ratingRow = p.rating!=null ? `
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:12px">
          <span style="color:#f59e0b;font-size:13px;letter-spacing:.5px">★★★★★</span>
          <span style="color:#ffffff;font-weight:700">${p.rating.toFixed(1)}</span>
          <span style="color:#96a6bd">·</span>
          <span style="color:#ffffff">${p.sales}${soldWord}</span>
        </div>` : '';

  const variantCards = variants.map(function(v){
    const bonusRibbon = v.promoBonus ? `
      <div class="pd-variant-bonus">${esc(v.promoBonus)} <span class="pd-variant-bonus-sep">·</span> ${lang==='en'?'resets in':'reset dalam'} <span id="pdPromoCountdown">--:--:--</span></div>` : '';
    return `
    <div class="pd-variant-card">
      <div class="pd-variant-top">
        <div>
          <div style="font-size:16px;font-weight:800;color:#ffffff">${esc(v.title)}</div>
          ${v.tag ? `<span class="pd-variant-tag">${esc(v.tag)}</span>` : ''}
        </div>
        <div class="pd-variant-price">${fmt(v.price)}</div>
      </div>
      <ul class="pd-feat" style="margin-top:14px">
        ${v.bullets.map(function(b){ return `<li><div class="pd-feat-check">✓</div><span>${esc(b)}</span></li>`; }).join('')}
      </ul>
      ${bonusRibbon}
      <a href="bayar.html?id=${esc(v.id)}" class="btn btn-primary btn-lg" style="width:100%;text-align:center;margin-top:16px;display:block">${esc(v.btnLabel)}</a>
    </div>`;
  }).join('');

  document.getElementById('pdContent').innerHTML = `
    <div class="pd-hero">
      <div class="pd-icon"><img src="${esc(p.img)}" alt="${esc(loc.short)}" style="width:100%;height:100%;object-fit:cover;display:block;"></div>
      <div class="pd-hero-body">
        ${badge}
        <div class="pd-name">${esc(loc.name)}</div>
        <div class="pd-tagline">${loc.tagline}</div>
        ${ratingRow}
        <div class="pd-price-pill">
          <div>
            <div class="pd-price-lbl">${startLbl}</div>
            <div class="pd-price-val">${fmt(lowestPrice)}</div>
          </div>
        </div>
      </div>
    </div>

    <div class="pd-sec">
      <div class="pd-sec-ttl">${lang==='en' ? 'About the Product' : 'Tentang Produk'}</div>
      <div class="pd-about">${loc.about.map(function(t){ return `<p style="margin-bottom:12px">${esc(t)}</p>`; }).join('')}</div>
    </div>

    <div class="pd-sec" id="pdVariants">
      <div class="pd-sec-ttl">${esc(chooseTtl)}</div>
      <div class="pd-variant-list">
        ${variantCards}
      </div>
    </div>

    ${caraOrderHtml(lang)}

    <div class="pd-note"><span>💡</span><span>${loc.note}</span></div>
  `;

  const ctaLbl = document.getElementById('ctaLbl');
  ctaLbl.textContent = startLbl;
  ctaLbl.removeAttribute('data-i18n');

  document.getElementById('ctaPrice').textContent = fmt(lowestPrice);

  const ctaBtn = document.getElementById('ctaBtn');
  ctaBtn.textContent = seeOptionsLbl;
  ctaBtn.removeAttribute('data-i18n');
  ctaBtn.href = '#pdVariants';
  ctaBtn.removeAttribute('target');
  ctaBtn.classList.remove('btn-gold');
  ctaBtn.classList.add('btn-primary');

  if (promoTimer) { clearInterval(promoTimer); promoTimer = null; }
  if (variants.some(function(v){ return v.promoBonus; })) {
    const tickPromo = () => {
      const el = document.getElementById('pdPromoCountdown');
      if (!el) { clearInterval(promoTimer); promoTimer = null; return; }
      el.textContent = promoRemainingText(promoCycleRemainingMs());
    };
    tickPromo();
    promoTimer = setInterval(tickPromo, 1000);
  }
}

render();
document.addEventListener('ipi-lang-change', render);
</script>
</body>
</html>
